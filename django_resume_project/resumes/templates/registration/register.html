{% extends "base.html" %}
{% block title %}Register — FolioCraft{% endblock %}
{% block content %}
<div class="fc-card" style="max-width:480px; margin:2rem auto;">
  <h1 style="margin-top:0; font-size:1.4rem;">Create Student Account</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="fc-btn fc-btn-primary" style="width:100%; justify-content:center; margin-top:0.5rem;">Register</button>
  </form>
  <p style="margin-top:1rem; font-size:0.875rem; color:#475569;">
    Already registered? <a href="{% url 'login' %}">Sign in</a>.
  </p>
</div>
{% endblock %}
